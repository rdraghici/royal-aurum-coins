spring:
  application:
    name: royal-aurum-coins-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/royal_aurum_coins}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration

app:
  version: "@project.version@"

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true
