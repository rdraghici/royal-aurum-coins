# Runs the same script a developer runs. A pull request merges only when this is green.
#
# Until the applications exist, only the product and policy steps run. Task T-003 extends the
# last step to `./scripts/verify.sh full` and adds Java, Docker and the Playwright browsers.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the checks compare the branch with main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/verify.sh full product policy
